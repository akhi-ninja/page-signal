name: Orchestrator package
on:
  pull_request:
    paths:
      - 'extensions/orchestrator/**'
      - 'test/orchestrator-package.test.mjs'
      - '.github/workflows/publish-orchestrator.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated package from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node --test test/orchestrator-package.test.mjs
      - name: Validate packed consumer
        run: |
          set -eu
          npm pack ./extensions/orchestrator --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --ignore-scripts "$RUNNER_TEMP/pagesignal-orchestrator-0.1.0.tgz" typescript@5.9.3 @types/node
          node --input-type=module -e "import {createPageWorkflow,workflowConfig} from '@pagesignal/orchestrator'; if(typeof createPageWorkflow !== 'function') process.exit(1); workflowConfig({tenantId:'test',documentId:'test'});"
          printf '%s\n' "import { workflowConfig, createPageWorkflow } from '@pagesignal/orchestrator';" "const config = workflowConfig({tenantId:'test',documentId:'test'}); void config; void createPageWorkflow;" > consumer.mts
          npx tsc --noEmit --strict --skipLibCheck --module nodenext consumer.mts
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrator-package
          path: ${{ runner.temp }}/pagesignal-orchestrator-0.1.0.tgz
  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-package
      - run: npm publish ./pagesignal-orchestrator-0.1.0.tgz --access public --provenance
